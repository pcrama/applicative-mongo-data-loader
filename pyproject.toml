[project]
name = "applicative-mongo-data-loader"
version = "0.1.0"
description = "Applicative specialised to MongoDB client of a sample web app"
readme = "README.org"
requires-python = ">=3.14"
dependencies = [
    "bunnet>=1.3.0",
    "fastapi[standard]>=0.149.0",
    "httpx2>=2.14.0",
    "pydantic-settings>=2.16.0",
    "sentry-sdk>=2.72.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ty>=0.0.89",
]

[tool.pytest.ini_options]
filterwarnings = [
  "ignore:.*general_plain_validator_function.*:DeprecationWarning:bunnet\\.odm\\.fields",
]
