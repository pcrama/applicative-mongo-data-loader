services:
  mongodb:
    # my personal dev machine is a "bit" old, so I need to pin the MongoDB version
    # https://github.com/docker-library/mongo/issues/619#issuecomment-3219318720
    image: mongo:4.4.18
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: Test1234
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  spotlight:
    image: ghcr.io/getsentry/spotlight:latest
    restart: unless-stopped
    ports:
      - "8969:8969"

volumes:
  mongo_data:
